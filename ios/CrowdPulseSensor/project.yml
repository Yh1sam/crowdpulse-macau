name: CrowdPulseSensor
options:
  bundleIdPrefix: org.crowdpulse
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  CrowdPulseSensor:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: CrowdPulse Sensor
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: "The camera is analysed on this device to count people anonymously. No images are stored or uploaded."
        NSLocationWhenInUseUsageDescription: "Location and compass heading identify where this sensor node stands and which way it faces."
        NSMotionUsageDescription: "Motion sensors detect whether the phone is stationary so that unreliable readings can be discounted."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        UIBackgroundModes: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.crowdpulse.sensor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
  CrowdPulseSensorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: CrowdPulseSensor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.crowdpulse.sensor.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CrowdPulseSensor:
    build:
      targets:
        CrowdPulseSensor: all
        CrowdPulseSensorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [CrowdPulseSensorTests]
