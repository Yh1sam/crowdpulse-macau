[project]
name = "crowdpulse"
version = "0.1.0"
description = "CrowdPulse Macau — privacy-preserving smartphone crowd intelligence (hackathon prototype)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "ml/tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
